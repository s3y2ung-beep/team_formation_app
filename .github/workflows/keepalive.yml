# 매일 DB에 질의를 보내 Supabase 무료 프로젝트가 일시정지되지 않게 함
name: DB keepalive

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 UTC 00:00 = 한국 시각 09:00
  workflow_dispatch:  # 손으로 한 번 실행해 볼 수 있게 함

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2"
      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
